[package]
name = "gswitch"
version = "0.1.0"
description = "A focused local Codex account switcher"
authors = ["Ginbing"]
edition = "2021"

[lib]
name = "gswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
