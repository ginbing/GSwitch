[package]
name = "gswitch"
version = "1.0.2"
description = "A focused local Codex account switcher"
authors = ["Ginbing"]
edition = "2021"

[lib]
name = "gswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
atomic-write-file = "0.3.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "=0.38.3", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
