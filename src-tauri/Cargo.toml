[package]
name = "gswitch"
version = "1.0.32"
description = "A focused local Codex account switcher"
authors = ["Ginbing"]
edition = "2021"

[lib]
name = "gswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
aes-gcm = "0.10"
atomic-write-file = "0.3.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
