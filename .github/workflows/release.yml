name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the tag to match the application version
        run: |
          version="$(node -p \"require('./src-tauri/tauri.conf.json').version\")"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Require signed updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || { echo "Missing required release variable: TAURI_UPDATER_PUBLIC_KEY" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing required release secret: TAURI_SIGNING_PRIVATE_KEY" >&2; exit 1; }
      - run: pnpm run version:check
      - run: pnpm test
      - run: pnpm build

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows
            os: windows-latest
            args: --bundles nsis
            rust_targets: ""
          - id: macos-silicon
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin
          - id: macos-intel
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust_targets: x86_64-apple-darwin
          - id: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux bundle prerequisites
        if: matrix.id == 'linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libgtk-3-dev
          libappindicator3-dev
          librsvg2-dev
          patchelf
          xdg-utils
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_targets }}
      - run: pnpm install --frozen-lockfile
      - name: Prepare the signed updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/write-updater-config.mjs
      - run: pnpm run version:check
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Import the configured Windows certificate
        if: matrix.id == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { exit 0 }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is configured.'
          }
          $encoded = Join-Path $env:RUNNER_TEMP 'gswitch-certificate.txt'
          $certificate = Join-Path $env:RUNNER_TEMP 'gswitch-certificate.pfx'
          Set-Content -LiteralPath $encoded -Value $env:WINDOWS_CERTIFICATE
          certutil -decode $encoded $certificate | Out-Host
          Import-PfxCertificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText) | Out-Null
          Remove-Item -LiteralPath $encoded, $certificate -Force
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GSwitch v__VERSION__
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.updater.conf.json ${{ matrix.args }}

  verify-draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify the complete draft asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          printf '%s\n' "$assets"
          test "$(printf '%s\n' "$assets" | grep -Eic 'setup\.exe$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Eic '\.dmg$')" -eq 2
          test "$(printf '%s\n' "$assets" | grep -Eic '\.AppImage$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Eic '\.deb$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Eic '^latest\.json$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Eic '\.sig$')" -eq 4
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = true
