name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '19 4 * * 1'

concurrency:
  group: gswitch-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      rust: ${{ steps.scope.outputs.rust }}
      platform: ${{ steps.scope.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "platform=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          frontend=false
          rust=false
          platform=false
          while IFS= read -r path; do
            case "$path" in
              src/*|index.html|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.node-version|tsconfig*.json|vite.config.*|postcss.config.*)
                frontend=true
                ;;
              src-tauri/*|rust-toolchain.toml)
                rust=true
                ;;
            esac
            case "$path" in
              .github/workflows/*|scripts/*|src-tauri/*|rust-toolchain.toml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.node-version|vite.config.*|postcss.config.*)
                frontend=true
                rust=true
                platform=true
                ;;
            esac
          done <<< "$changed"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:source frontend
        env:
          GSWITCH_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GSWITCH_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  platform-build:
    name: ${{ matrix.check_name }}
    needs: changes
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.platform == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            check_name: macOS build
          - os: windows-latest
            check_name: Windows build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-
      - name: Check platform Rust targets
        run: pnpm run ci:source platform
        env:
          GSWITCH_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GSWITCH_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  linux:
    name: Linux build
    needs: changes
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Tauri Linux build dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libgtk-3-dev
          libappindicator3-dev
          librsvg2-dev
          patchelf
          xdg-utils
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-
      - run: pnpm run ci:source linux
        env:
          GSWITCH_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GSWITCH_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: false

  rustsec:
    name: RustSec
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - id: audit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-rustsec-${{ hashFiles('rust-toolchain.toml') }}-cargo-audit-0.22.2
      - name: Install RustSec cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit Cargo.lock
        run: cargo audit --file src-tauri/Cargo.lock

  gate:
    name: CI gate
    if: always()
    needs: [changes, frontend, platform-build, linux, dependency-review, rustsec]
    runs-on: ubuntu-latest
    steps:
      - name: Check required source and security results
        env:
          EVENT_NAME: ${{ github.event_name }}
          FRONTEND_SCOPE: ${{ needs.changes.outputs.frontend }}
          RUST_SCOPE: ${{ needs.changes.outputs.rust }}
          PLATFORM_SCOPE: ${{ needs.changes.outputs.platform }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PLATFORM_RESULT: ${{ needs.platform-build.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          RUSTSEC_RESULT: ${{ needs.rustsec.result }}
        shell: bash
        run: |
          fail=0
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "CI scope detection failed: $CHANGES_RESULT"
            fail=1
          fi
          check_scoped() {
            name="$1"; scope="$2"; result="$3"
            if [[ "$scope" == "true" && "$result" != "success" ]]; then
              echo "$name was required ($scope) but finished as $result"
              fail=1
            elif [[ "$scope" != "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "$name failed outside its selected scope: $result"
              fail=1
            fi
          }
          check_scoped "Frontend" "$FRONTEND_SCOPE" "$FRONTEND_RESULT"
          linux_scope="$RUST_SCOPE"
          check_scoped "Linux build" "$linux_scope" "$LINUX_RESULT"
          check_scoped "Windows/macOS build" "$PLATFORM_SCOPE" "$PLATFORM_RESULT"
          if [[ "$EVENT_NAME" == "pull_request" && "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
            echo "Dependency review must succeed for pull requests: $DEPENDENCY_REVIEW_RESULT"
            fail=1
          fi
          if [[ "$RUSTSEC_RESULT" != "success" ]]; then
            echo "RustSec must succeed: $RUSTSEC_RESULT"
            fail=1
          fi
          exit "$fail"
